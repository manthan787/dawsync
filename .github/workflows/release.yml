name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build macOS (${{ matrix.asset_arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            python_arch: arm64
            binary_arch: arm64
            asset_arch: Apple-Silicon
          - runner: macos-15-intel
            python_arch: x64
            binary_arch: x86_64
            asset_arch: Intel
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}
          cache: pip

      - name: Validate release tag
        run: |
          python scripts/release.py check-tag "$RELEASE_TAG"
          echo "VERSION=$(python scripts/release.py version)" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-desktop.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build application
        run: python scripts/build.py

      - name: Verify and archive application
        env:
          BINARY_ARCH: ${{ matrix.binary_arch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          APP="dist/DAWSync.app"
          EXECUTABLE="$APP/Contents/MacOS/DAWSync"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$VERSION"
          file "$EXECUTABLE" | grep -q "Mach-O 64-bit executable $BINARY_ARCH"
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "$APP" "release/DAWSync-$VERSION-macOS-$ASSET_ARCH.zip"

      - name: Upload application archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.asset_arch }}
          path: release/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build-macos
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_NOTES: |
        DAWSync is currently an early preview for Ableton Live 12 on macOS and REAPER 7.

        Choose the Apple Silicon download for M-series Macs or the Intel download for Intel Macs. These builds are ad-hoc signed but not yet notarized; after unzipping, Control-click DAWSync and choose Open the first time. The REAPER helper is already included in every generated session, and is also available separately below.
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download application archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: macos-*
          path: release
          merge-multiple: true

      - name: Package REAPER helper and checksums
        run: |
          python scripts/release.py check-tag "$RELEASE_TAG"
          VERSION="$(python scripts/release.py version)"
          mkdir -p package/DAWSync-REAPER-helper
          cp reaper/DAWSync.lua reaper/codec.lua package/DAWSync-REAPER-helper/
          cp docs/WINDOWS.md package/DAWSync-REAPER-helper/README.md
          (cd package && zip -qr "../release/DAWSync-$VERSION-REAPER-helper.zip" DAWSync-REAPER-helper)
          for archive in release/*.zip; do unzip -t "$archive"; done
          (cd release && sha256sum *.zip > SHA256SUMS.txt)

      - name: Publish release
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes --notes "$RELEASE_NOTES"
