[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dawsync"
dynamic = ["version"]
description = "Versioned audio collaboration between Ableton Live and REAPER"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
desktop = ["PySide6==6.11.2"]
build = ["PyInstaller==6.22.3"]

[project.scripts]
dawsync = "dawsync.cli:main"
dawsync-app = "dawsync.app:main"

[tool.setuptools]
packages = ["dawsync"]

[tool.setuptools.dynamic]
version = {attr = "dawsync.__version__"}
